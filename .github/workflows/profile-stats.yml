name: Refresh profile stats

# Cache public stats SVGs in this repository so the profile keeps rendering
# even if a third-party card service is temporarily unavailable.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  refresh-profile-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Fetch fresh public profile cards
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          mkdir -p profile-summary-card-output/github_dark profile

          fetch_svg() {
            url="$1"
            output="$2"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 3 --retry-all-errors \
              "$url" -o "$tmp_dir/$output"
            grep -q '<svg' "$tmp_dir/$output"
          }

          fetch_svg "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=${PROFILE_USER}&theme=github_dark" profile-details.svg
          fetch_svg "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=${PROFILE_USER}&theme=github_dark" stats.svg
          fetch_svg "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=${PROFILE_USER}&theme=github_dark" repos-per-language.svg
          fetch_svg "https://streak-stats.demolab.com?user=${PROFILE_USER}&theme=dark&hide_border=true&background=0E0E18&ring=FF6B35&fire=00D4FF&currStreakLabel=FF6B35&sideLabels=F0F0FA&dates=8B8B9E&disable_animations=true" streak.svg

          mv "$tmp_dir/profile-details.svg" profile-summary-card-output/github_dark/0-profile-details.svg
          mv "$tmp_dir/stats.svg" profile-summary-card-output/github_dark/3-stats.svg
          mv "$tmp_dir/repos-per-language.svg" profile-summary-card-output/github_dark/1-repos-per-language.svg
          mv "$tmp_dir/streak.svg" profile/streak.svg

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/github_dark/0-profile-details.svg \
                  profile-summary-card-output/github_dark/1-repos-per-language.svg \
                  profile-summary-card-output/github_dark/3-stats.svg \
                  profile/streak.svg
          if git diff --cached --quiet; then
            echo "No profile stat changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push
